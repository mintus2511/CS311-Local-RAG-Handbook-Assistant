services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DISTANCE_THRESHOLD: "0.60"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
